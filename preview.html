<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenzia · Opciones de portada</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --cream: #e6e4d6;
      --green: #294b32;
      --hair: rgba(41, 75, 50, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px clamp(16px, 4vw, 48px) 64px;
      background: var(--cream);
      color: var(--green);
      font-family: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }
    header { max-width: 1400px; margin: 0 auto 28px; }
    h1 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    header p { margin: 0; font-size: 0.85rem; opacity: 0.65; line-height: 1.6; }
    header code {
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(41, 75, 50, 0.1);
      font-size: 0.8rem;
    }
    .grid {
      display: grid;
      gap: 28px;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      max-width: 1400px;
      margin: 0 auto;
    }
    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--hair);
      border-radius: 12px;
      background: #fff;
    }
    /* Each thumbnail renders the page at a real 1280x800 desktop viewport,
       then scales it down to the card width (see the fit() script below). */
    .frame { position: relative; aspect-ratio: 1280 / 800; overflow: hidden; }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 800px;
      border: 0;
      display: block;
      transform-origin: top left;
    }
    figcaption {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid var(--hair);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
    }
    figcaption b { font-weight: 500; }
    figcaption span { opacity: 0.6; }
    figcaption a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--hair); }
  </style>
</head>
<body>
  <header>
    <h1>Zenzia · opciones de portada</h1>
    <p>
      Elige una y publícala con <code>./use-option.sh 03</code> (o el nombre de la carpeta).
      Abre cada opción en pestaña aparte para verla a pantalla completa.
    </p>
  </header>

  <div class="grid">
    <figure>
      <div class="frame"><iframe src="./options/01-serena/index.html" title="Opción 1 · Serena" loading="lazy"></iframe></div>
      <figcaption><b>01 · Serena</b> <span>crema, mínima, sin movimiento</span> <a href="./options/01-serena/index.html" target="_blank" rel="noopener">abrir</a></figcaption>
    </figure>

    <figure>
      <div class="frame"><iframe src="./options/02-nocturna/index.html" title="Opción 2 · Nocturna" loading="lazy"></iframe></div>
      <figcaption><b>02 · Nocturna</b> <span>verde profundo, logo claro</span> <a href="./options/02-nocturna/index.html" target="_blank" rel="noopener">abrir</a></figcaption>
    </figure>

    <figure>
      <div class="frame"><iframe src="./options/03-ondas/index.html" title="Opción 3 · Ondas" loading="lazy"></iframe></div>
      <figcaption><b>03 · Ondas</b> <span>ondas de agua animadas</span> <a href="./options/03-ondas/index.html" target="_blank" rel="noopener">abrir</a></figcaption>
    </figure>

    <figure>
      <div class="frame"><iframe src="./options/04-editorial/index.html" title="Opción 4 · Editorial" loading="lazy"></iframe></div>
      <figcaption><b>04 · Editorial</b> <span>logo + texto, dos columnas</span> <a href="./options/04-editorial/index.html" target="_blank" rel="noopener">abrir</a></figcaption>
    </figure>

    <figure>
      <div class="frame"><iframe src="./options/05-vapor/index.html" title="Opción 5 · Vapor" loading="lazy"></iframe></div>
      <figcaption><b>05 · Vapor</b> <span>oscura, vapor en movimiento</span> <a href="./options/05-vapor/index.html" target="_blank" rel="noopener">abrir</a></figcaption>
    </figure>
  </div>

  <script>
    // Scale every thumbnail's 1280x800 iframe down to its card width.
    function fit() {
      document.querySelectorAll(".frame").forEach(function (frame) {
        var iframe = frame.querySelector("iframe");
        iframe.style.transform = "scale(" + frame.clientWidth / 1280 + ")";
      });
    }

    fit();
    addEventListener("resize", fit);
  </script>
</body>
</html>
