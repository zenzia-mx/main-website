<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Zenzia</title>
  <style>
    .leaf { fill: #294b32; }
    @media (prefers-color-scheme: dark) {
      .leaf { fill: #f2f0e2; }
    }
  </style>
  <mask id="leaf" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
    <image width="256" height="256" href="data:image/png;base64,"/>
  </mask>
  <rect width="256" height="256" class="leaf" mask="url(#leaf)"/>
</svg>
